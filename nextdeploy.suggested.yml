# Generated by `nextdeploy init` from your existing app.
app:
  name: NextDeploy
  domain: "" # optional custom domain, e.g. example.com — attached automatically on ship

serverless:
  provider: cloudflare
  cloudflare:
    bindings:
      r2:
        - { name: ASSETS }
      kv:
        - { name: CACHE, ref: app-cache }
      hyperdrive:
        - { name: DB, ref: primary }
    resources:
      hyperdrive:
        - { name: primary, origin_env: DATABASE_URL }
      kv:
        - { name: app-cache }
    protection:
      enabled: true
      auth:
        secret_env: AUTH_SECRET
        protected_paths: ["/app/*"]
        login_path: /login
      rate_limit:
        requests_per_minute: 60
