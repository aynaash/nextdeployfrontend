# NextDeploy config — docs site on Cloudflare Workers.
# Minimal on purpose: just the static-asset bucket. No Hyperdrive/AI/KV or edge
# auth/rate-limit (add them back if/when the app actually needs them).
app:
  name: nextdeploy
  domain:
    name: nextdeploy.org
    provider: cloudflare
    dns: auto # nextdeploy attaches it as a CF Workers Custom Domain (DNS + route + SSL)

serverless:
  provider: cloudflare
  cloudflare:
    compatibility_date: "2025-04-01"
    compatibility_flags: [nodejs_compat_v2]

    bindings:
      r2:
        - { name: ASSETS }
